version = 1
id = "default"
title = "Default Python workflow"

[tooling]
summary = "Python package workflow using uv, uv_build, pytest, ruff, ty, and a src/ package layout."
default_validation = [
  "uv run ruff check",
  "uv run ty check",
  "uv run pytest",
]

[environment]
managed_roles = ["developer", "reviewer", "integrator"]
pre_session = []
# Conditional so greenfield projects work before the first pyproject.toml exists.
setup = [
  "test -f pyproject.toml && uv sync || true",
]
post_session = []

[timeouts]
pre_session = 300
setup = 600
post_session = 300
