# DevLab worker agent configuration.
#
# This file is owned by the human operator of the target repository. It controls
# how DevLab invokes agent sessions for each role.
#
# Values in [defaults] apply to every role. A [roles.<role>] table overrides
# defaults for one role. Supported roles are:
# architect, planner, developer, reviewer, integrator, and the optional
# auxiliary researcher role.
#
# Provider command templates may use these placeholders:
# {role_name}, {provider}, {model}, {effort}, {system_prompt}, {session_prompt}
#
# When running sessions, DevLab records provider version info in session metadata
# by trying `<command executable> --version`; set provider `version_command` to override
# or to "" to skip discovery.
#
# See docs/agent-configuration.md in the DevLab repository for full reference.

[defaults]
provider = "default"
model = ""
effort = ""
max_session_duration_seconds = 3600
# Optional silence detection. Any bytes on stdout or stderr reset this limit.
# inactivity_timeout_seconds = 600

[providers.default]
command = "claude"
args = [
    "-p",
    "--system-prompt", "{system_prompt}",
    "{session_prompt}",
]

# Prefer stdin prompt transport when supported; it avoids argv length limits and
# keeps prompt text out of process listings.
#
# Example: Codex-style stdin invocation.
# [providers.codex]
# command = "codex"
# args = ["--model", "{model}", "--search", "--dangerously-bypass-approvals-and-sandbox", "exec", "-"]
# stdin_template = "{system_prompt}\n\n---\n\n{session_prompt}"

# Example: Pi-style CLI invocation.
# [defaults]
# provider = "pi"
# model = "gpt-5-codex"
# effort = "medium"
#
# [providers.pi]
# command = "pi"
# args = [
#     "-p",
#     "--model", "{model}",
#     "--effort", "{effort}",
#     "--system-prompt", "{system_prompt}",
#     "{session_prompt}",
# ]

# Example: Claude-style CLI invocation.
# [providers.claude]
# command = "claude"
# args = [
#     "-p",
#     "--model", "{model}",
#     "--system-prompt", "{system_prompt}",
#     "{session_prompt}",
# ]

# Example: use a different provider/model for review to reduce shared blind spots.
# [roles.developer]
# provider = "codex"
# model = "gpt-5-codex"
# effort = "medium"
#
# [roles.reviewer]
# provider = "claude"
# model = "claude-sonnet-4.5"
# effort = "high"

