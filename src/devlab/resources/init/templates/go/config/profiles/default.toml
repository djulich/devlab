version = 1
id = "default"
title = "Go module workflow"

[tooling]
summary = "Go module using gofmt, go vet, and go test."
default_validation = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "go test ./...",
]

[environment]
managed_roles = ["developer", "reviewer", "integrator"]
pre_session = []
setup = []
post_session = []

[timeouts]
pre_session = 300
setup = 600
post_session = 300
