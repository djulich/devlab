version = 1
managed_roles = ["developer", "reviewer", "integrator"]

# Commands run before setup to remove state left by a crashed or interrupted session.
pre_session = []

# Commands run before each managed role session.
setup = [
  "uv sync",
]

# Commands always attempted after each managed role session.
post_session = []

[timeouts]
pre_session = 300
setup = 600
post_session = 300
