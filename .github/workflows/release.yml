name: Prepare release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Verify tag and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Run complete validation
        run: make check

      - name: Build and verify release artifacts
        run: >-
          uv run python scripts/release_check.py
          --expected-tag "$GITHUB_REF_NAME"
          --dist-dir "$DIST_DIR"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$DIST_DIR"/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --title "DevLab ${GITHUB_REF_NAME#v}"
          --notes-from-tag
