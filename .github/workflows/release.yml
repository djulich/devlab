name: Prepare release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Run complete validation
        run: make check

      - name: Build and verify release artifacts
        run: >-
          uv run python scripts/release_check.py
          --expected-tag "$GITHUB_REF_NAME"
          --dist-dir "$DIST_DIR"

      - name: Store verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$DIST_DIR"/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --title "DevLab ${GITHUB_REF_NAME#v}"
          --notes-from-tag
