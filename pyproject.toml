[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
harness = "harness.orchestrator:main"
