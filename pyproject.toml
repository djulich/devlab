[project]
name = "devlab"
version = "0.1.1"
description = "CLI that turns repository-stored specifications, plans, and tasks into reviewed software changes through bounded, role-based agent sessions."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "DevLab contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

[project.urls]
Documentation = "https://github.com/djulich/devlab/blob/main/docs/README.md"
Issues = "https://github.com/djulich/devlab/issues"
Source = "https://github.com/djulich/devlab"

[dependency-groups]
dev = ["pytest", "pyyaml", "ruff", "ty"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["Makefile", "scripts/release_check.py", "tests/**", "uv.lock"]
source-exclude = ["/demos"]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
devlab = "devlab.cli:main"
